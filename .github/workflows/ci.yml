name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-tui.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-tui.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Security (bandit)
        run: bandit -q -c pyproject.toml -r monitor
      - name: Dependencies audit (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-tui.txt
      - name: Tests (coverage must stay above 85%)
        env:
          REQUIRE_SSH: "1"
        run: pytest -q --cov
